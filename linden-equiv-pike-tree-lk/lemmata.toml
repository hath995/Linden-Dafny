[package]
name = "linden-equiv-pike-tree-lk"
version = "1.0.0"
description = "linden-equiv layer: PikeTreeLk (machine-checked RegElk/Linden equivalence)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

[dependencies]
linden-engine = "^1.0.0"
linden-engine-model = "^1.0.0"
linden-semantics-core = "^1.0.0"
linden-warblre = "^1.0.0"
