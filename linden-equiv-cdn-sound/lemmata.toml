[package]
namespace = "linden"
name = "equiv-cdn-sound"
version = "1.0.0"
description = "linden-equiv layer: CdnSound (G5: the CDN guard table means MatchesV at the empty span; spec-side tie)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

[dependencies]
linden.bridge = "^1.0.0"
linden.semantics-core = "^1.0.0"
linden.warblre = "^1.0.0"
linden.regex-engine = "^1.0.0"
linden.equiv-actions-rep-re = "^1.0.0"
linden.equiv-look-leaves = "^1.0.0"
linden.equiv-nulled-plus = "^1.0.0"
linden.equiv-oracle-bridge-v = "^1.0.0"
linden.equiv-oracle-reach = "^1.0.0"
linden.equiv-tree-rep-re = "^1.0.0"
