[package]
namespace = "linden"
name = "equiv-lift-sim-main"
version = "1.0.0"
description = "linden-equiv LiftSim layer 7: Main (machine-checked RegElk/Linden equivalence)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"
cores = "4"

[verification]
expected-errors = [
]

