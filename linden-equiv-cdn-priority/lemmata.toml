[package]
namespace = "linden"
name = "equiv-cdn-priority"
version = "1.0.0"
description = "linden-equiv layer: CdnPriority — G5a rung A: the spec-level priority theorem for the greedy nullable plus whose skip arm is guarded by an empty-path test (CDN), with the CIN theorem as its Some case"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

[dependencies]
linden.reasoning = "^1.0.0"
linden.semantics-core = "^1.0.0"
linden.warblre = "^1.0.0"
linden.regex-engine = "^1.0.0"
linden.equiv-actions-rep-re = "^1.0.0"
linden.equiv-check-erase = "^1.0.0"
linden.equiv-entry-lk = "^1.0.0"
linden.equiv-tree-rep-re = "^1.0.0"
linden.equiv-look-leaves = "^1.0.0"
linden.equiv-nulled-plus = "^1.0.0"
