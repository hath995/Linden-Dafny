[package]
name = "linden-equiv-main-theorem"
version = "1.0.0"
description = "linden-equiv layer: MainTheorem (machine-checked RegElk/Linden equivalence)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"
cores = "4"

[verification]
expected-errors = [
]

[dependencies]
linden-engine = "^1.0.0"
linden-engine-model = "^1.0.0"
linden-reasoning = "^1.0.0"
linden-semantics-core = "^1.0.0"
linden-warblre = "^1.0.0"
regex-engine = "^1.0.0"
linden-equiv-actions-rep-re = "^1.0.0"
linden-equiv-actions-tree-rep-re = "^1.0.0"
linden-equiv-check-erase = "^1.0.0"
linden-equiv-clock-mono = "^1.0.0"
linden-equiv-entry-lk = "^1.0.0"
linden-equiv-look-capture = "^1.0.0"
linden-equiv-look-leaves = "^1.0.0"
linden-equiv-look-tables = "^1.0.0"
linden-equiv-nest-inv = "^1.0.0"
linden-equiv-nfa-rep-re = "^1.0.0"
linden-equiv-oracle-entry = "^1.0.0"
linden-equiv-oracle-spec = "^1.0.0"
linden-equiv-pike-inv-re = "^1.0.0"
linden-equiv-pike-sim-re = "^1.0.0"
linden-equiv-regs-laws = "^1.0.0"
linden-equiv-tree-rep-re = "^1.0.0"
linden-equiv-tree-thread-re = "^1.0.0"
linden-equiv-walk-ok = "^1.0.0"
linden-equiv-walk-ok-entry = "^1.0.0"
