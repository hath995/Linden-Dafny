[package]
namespace = "linden"
name = "equiv-nulled-plus-lk"
version = "1.0.0"
description = "linden-equiv G4b: the Lk-carrying first empty path of a CI-nullable plus body, its exact leaf (NulledIterationLeaf) and exact rung A"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

[dependencies]
linden.bridge = "^1.0.0"
linden.semantics-core = "^1.0.0"
linden.warblre = "^1.0.0"
linden.regex-engine = "^1.0.0"
linden.equiv-actions-rep-re = "^1.0.0"
linden.equiv-check-erase = "^1.0.0"
linden.equiv-entry-lk = "^1.0.0"
linden.equiv-tree-rep-re = "^1.0.0"
linden.equiv-look-leaves = "^1.0.0"
linden.equiv-nulled-plus = "^1.0.0"
linden.equiv-cdn-priority = "^1.0.0"
linden.engine-model = "^1.0.0"
