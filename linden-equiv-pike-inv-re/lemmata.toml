[package]
namespace = "linden"
name = "equiv-pike-inv-re"
version = "1.0.0"
description = "linden-equiv layer: PikeInvRE (machine-checked RegElk/Linden equivalence)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

[dependencies]
linden.engine = "^1.0.0"
linden.engine-model = "^1.0.0"
linden.reasoning = "^1.0.0"
linden.semantics-core = "^1.0.0"
linden.warblre = "^1.0.0"
linden.regex-engine = "^1.0.0"
linden.equiv-actions-rep-re = "^1.0.0"
linden.equiv-actions-tree-rep-re = "^1.0.0"
linden.equiv-look-tables = "^1.0.0"
linden.equiv-nfa-rep-re = "^1.0.0"
linden.equiv-regs-laws = "^1.0.0"
linden.equiv-tree-thread-re = "^1.0.0"
