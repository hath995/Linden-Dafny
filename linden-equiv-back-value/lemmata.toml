[package]
name = "linden-equiv-back-value"
version = "1.0.0"
description = "linden-equiv layer: BackValue (machine-checked RegElk/Linden equivalence)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

[dependencies]
linden-reasoning = "^1.0.0"
linden-semantics-core = "^1.0.0"
regex-engine = "^1.0.0"
linden-equiv-mirror = "^1.0.0"
linden-equiv-nfa-rep-re = "^1.0.0"
linden-equiv-oracle-build = "^1.0.0"
