[package]
namespace = "linden"
name = "equiv-look-bank"
version = "1.0.0"
description = "linden-equiv layer: LookBank (G2: a set look record is positive, preserved by the engine)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

[dependencies]
"linden.regex-engine" = "^1.0.0"
"linden.equiv-clock-mono" = "^1.0.0"
"linden.equiv-look-tables" = "^1.0.0"
