[package]
namespace = "linden"
name = "equiv-mirror-world"
version = "1.0.0"
description = "linden-equiv layer: MirrorWorld (G1: a_cp bank bounds, FXR involution, per-row mirror tie; direction-generic flip mirror, oracle transport, keystone/gate restatements, split closedness ladder; lookbehind oracle column by the MatchesV route)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

