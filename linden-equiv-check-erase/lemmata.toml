[package]
namespace = "linden"
name = "equiv-check-erase"
version = "1.0.0"
description = "linden-equiv layer: CheckErase (machine-checked RegElk/Linden equivalence)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

[dependencies]
linden.engine-model = "^1.0.0"
linden.reasoning = "^1.0.0"
linden.semantics-core = "^1.0.0"
linden.warblre = "^1.0.0"
linden.equiv-entry-lk = "^1.0.0"
