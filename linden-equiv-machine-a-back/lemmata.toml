[package]
namespace = "linden"
name = "equiv-machine-a-back"
version = "1.0.0"
description = "linden-equiv G3b: machine A at a lookbehind body through the mirrored world (BackRowReadout, the row keys, the mirrored plus table)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"
cores = "4"

[verification]
expected-errors = [
]

