[package]
namespace = "linden"
name = "equiv-flip-statics"
version = "1.0.0"
description = "linden-equiv layer: FlipStatics (machine-checked RegElk/Linden equivalence)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

[dependencies]
linden.reasoning = "^1.0.0"
linden.semantics-core = "^1.0.0"
linden.warblre = "^1.0.0"
linden.regex-engine = "^1.0.0"
linden.equiv-actions-rep-re = "^1.0.0"
linden.equiv-back-gm-mirror = "^1.0.0"
linden.equiv-flip-disc = "^1.0.0"
linden.equiv-flip-mirror = "^1.0.0"
linden.equiv-flip-oracle = "^1.0.0"
linden.equiv-flip-rev = "^1.0.0"
linden.equiv-look-behind-value = "^1.0.0"
linden.equiv-look-leaves = "^1.0.0"
linden.equiv-mirror = "^1.0.0"
linden.equiv-nfa-rep-re = "^1.0.0"
linden.equiv-oracle-build = "^1.0.0"
linden.equiv-oracle-mirror-v = "^1.0.0"
linden.equiv-oracle-spec = "^1.0.0"
