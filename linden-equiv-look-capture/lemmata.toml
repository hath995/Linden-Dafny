[package]
name = "linden-equiv-look-capture"
version = "1.0.0"
description = "linden-equiv layer: LookCapture (machine-checked RegElk/Linden equivalence)"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

[dependencies]
regex-engine = "^1.0.0"
linden-equiv-clock-mono = "^1.0.0"
linden-equiv-look-tables = "^1.0.0"
linden-equiv-nest-inv = "^1.0.0"
linden-equiv-nfa-rep-re = "^1.0.0"
linden-equiv-oracle-build = "^1.0.0"
linden-equiv-pike-inv-re = "^1.0.0"
