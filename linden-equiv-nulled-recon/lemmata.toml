[package]
namespace = "linden"
name = "equiv-nulled-recon"
version = "1.0.0"
description = "linden-equiv layer: NulledRecon — §2.5b stage 2 rung E: the null interpreter over ReconstructNulled code computes the first empty path's register writes; the reconstruction readout"
license = "MIT"

[toolchain]
dafny = ">= 4.11.0"

[source]
to_export = ["src/**/*.dfy"]

[options]
standard-libraries = true
verification-time-limit = "900"

[verification]
expected-errors = [
]

[dependencies]
linden.reasoning = "^1.0.0"
linden.semantics-core = "^1.0.0"
linden.warblre = "^1.0.0"
linden.regex-engine = "^1.0.0"
linden.equiv-actions-rep-re = "^1.0.0"
linden.equiv-nfa-rep-re = "^1.0.0"
linden.equiv-tree-rep-re = "^1.0.0"
linden.equiv-nulled-plus = "^1.0.0"
linden.equiv-pike-inv-re = "^1.0.0"
